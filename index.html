<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087dcc"><title>ROLLY V6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#eaf4fa;color:#173950}.app{max-width:480px;height:100dvh;margin:auto;position:relative;background:#f5f9fc;overflow:hidden}.top{height:125px;position:absolute;inset:0 0 auto;z-index:1000;background:white;padding:11px 13px;border-bottom:1px solid #dce7ed}.brand{display:flex;justify-content:space-between;align-items:center}.name{font-size:22px;font-weight:950;color:#062852}.logo{display:inline-grid;place-items:center;width:37px;height:37px;border-radius:12px;background:linear-gradient(145deg,#087dcc,#08a89d);color:white;margin-right:7px}.ad{border:0;border-radius:50%;width:35px;height:35px;color:#087dcc;background:#eaf5fc;font-weight:900}.search{margin-top:9px;background:#eff5f8;border-radius:12px;padding:10px}.search input{border:0;outline:0;background:transparent;width:90%}.chips{display:flex;gap:6px;overflow:auto;padding-top:8px}.chip{white-space:nowrap;border:1px solid #d8e5ed;border-radius:99px;background:#fff;padding:6px 10px;font-size:10px}.chip.on{background:#087dcc;color:white}.map{position:absolute;inset:125px 0 153px}.status{position:absolute;z-index:900;left:12px;right:72px;bottom:163px;background:#fffffff2;border:1px solid #d8e5ed;border-radius:11px;padding:8px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status.good{color:#078850}.status.bad{color:#a33b3b}.locate{position:absolute;z-index:900;right:13px;bottom:160px;width:49px;height:49px;border:0;border-radius:50%;background:white;color:#087dcc;font-size:24px;box-shadow:0 4px 15px #173c5840}.cards{position:absolute;z-index:800;left:0;right:0;bottom:74px;height:79px;background:#fff;display:flex;gap:7px;overflow:auto;padding:8px}.mini{min-width:177px;border:1px solid #dce7ed;border-radius:12px;padding:8px;display:grid;grid-template-columns:35px 1fr 32px;gap:6px;align-items:center;background:white}.ico{width:35px;height:35px;border-radius:9px;background:#eaf5fa;display:grid;place-items:center}.mini b{font-size:10px;display:block}.mini small{font-size:8px;color:#738899}.score{width:31px;height:31px;border-radius:9px;background:#dcf7e8;color:#078850;display:grid;place-items:center;font-size:10px;font-weight:900}.nav{position:absolute;z-index:1000;bottom:0;left:0;right:0;height:74px;background:#fffffff7;border-top:1px solid #dce7ed;display:flex;align-items:center;justify-content:space-around}.nav button{border:0;background:none;color:#708899;font-size:9px;display:flex;flex-direction:column;align-items:center}.nav i{font-style:normal;font-size:19px}.nav .active{color:#087dcc}.nav .plus{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#087dcc,#08a89d);color:white;font-size:27px;margin-top:-21px}.pin{width:34px;height:34px;border-radius:50% 50% 50% 10px;transform:rotate(-45deg);display:grid;place-items:center;border:3px solid white;box-shadow:0 3px 10px #173c5855}.pin span{transform:rotate(45deg);color:white}.goodpin{background:#08a89d}.midpin{background:#e1a11d}.me{width:20px;height:20px;border-radius:50%;background:#168bdc;border:4px solid white;box-shadow:0 0 0 8px #168bdc33}.popup b{color:#062852}.popup button{border:0;background:#087dcc;color:#fff;border-radius:8px;padding:6px 8px;margin-top:5px}.sheetbg{display:none;position:absolute;inset:0;z-index:2000;background:#102d4470;align-items:flex-end}.sheetbg.show{display:flex}.sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:17px 15px 26px}.row{padding:11px 0;border-bottom:1px solid #edf2f5;font-size:12px}.row span{float:right;color:#078850;font-weight:900}.wide{width:100%;border:0;background:#087dcc;color:white;border-radius:12px;padding:12px;margin-top:12px;font-weight:900}.toast{display:none;position:absolute;z-index:3000;left:50%;bottom:170px;transform:translateX(-50%);background:#12354e;color:#fff;border-radius:11px;padding:9px 12px;font-size:10px}.toast.show{display:block}
</style></head><body><div class="app">
<header class="top"><div class="brand"><div class="name"><span class="logo">♿</span>ROLLY <small style="font-size:9px;color:#08a89d">V6</small></div><button class="ad">AD</button></div><div class="search">⌕ <input id="q" placeholder="Zoek op de kaart…" onkeydown="if(event.key==='Enter')searchMap()"></div><div class="chips"><button class="chip on" onclick="cat('Alles',this)">Alles</button><button class="chip" onclick="cat('Horeca',this)">Horeca</button><button class="chip" onclick="cat('Zorg',this)">Zorg</button><button class="chip" onclick="cat('Cultuur',this)">Cultuur</button><button class="chip" onclick="cat('Toilet',this)">Toilet</button></div></header>
<div id="map" class="map"></div><div id="status" class="status">Tik op ⌖ voor je live GPS-positie</div><button class="locate" onclick="locateMe()">⌖</button><div id="cards" class="cards"></div>
<nav class="nav"><button class="active"><i>⌂</i>Kaart</button><button onclick="toast('Gebruik zoeken bovenaan')"><i>⌕</i>Zoeken</button><button class="plus" onclick="toast('Obstakel melden volgt in V7')">＋</button><button onclick="toast('Community volgt in V7')"><i>♿</i>Community</button><button onclick="toast('Profiel volgt in V7')"><i>☰</i>Meer</button></nav>
<div id="sheetbg" class="sheetbg" onclick="if(event.target===this)this.classList.remove('show')"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const C=[51.1312,4.5704],P=[{id:1,n:"Café De Spot",c:"Horeca",a:51.1318,o:4.5718,s:9.2,i:"☕",d:["Drempelloos","Deur 90 cm","Toegankelijk toilet"]},{id:2,n:"Stadsbibliotheek",c:"Cultuur",a:51.1301,o:4.5681,s:8.6,i:"📚",d:["Lift aanwezig","Drempelloos","Toegankelijk toilet"]},{id:3,n:"Zorgpunt",c:"Zorg",a:51.1347,o:4.5758,s:9.0,i:"🏥",d:["Brede deuren","Rolstoelparking","Volledig toegankelijk"]},{id:4,n:"Bistro Markt",c:"Horeca",a:51.129,o:4.5729,s:7.5,i:"🍽️",d:["Drempel 2 cm","Terras toegankelijk"]},{id:5,n:"Toegankelijk toilet",c:"Toilet",a:51.1308,o:4.5718,s:9.4,i:"♿",d:["Drempelloos","Ruime cabine"]}];let map,me,acc,markers=[],active="Alles",my=C;
function init(){if(typeof L==="undefined"){status.className="status bad";status.textContent="Kaart kon niet laden";return}map=L.map("map").setView(C,15);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);render()}
function pin(p){return L.divIcon({className:"",html:`<div class="pin ${p.s>=8.5?"goodpin":"midpin"}"><span>♿</span></div>`,iconSize:[34,34],iconAnchor:[17,32]})}
function render(){markers.forEach(x=>x.remove());markers=[];let a=P.filter(p=>active==="Alles"||p.c===active);a.forEach(p=>{let m=L.marker([p.a,p.o],{icon:pin(p)}).addTo(map).bindPopup(`<div class=popup><b>${p.i} ${p.n}</b><br><small>${p.c} · ROLLY ${p.s.toFixed(1).replace(".",",")}</small><br><button onclick="details(${p.id})">Bekijk</button></div>`);markers.push(m)});cards.innerHTML=a.map(p=>`<div class=mini onclick="focus(${p.id})"><div class=ico>${p.i}</div><div><b>${p.n}</b><small>${p.c}</small></div><div class=score>${p.s.toFixed(1).replace(".",",")}</div></div>`).join("")}
function cat(c,e){active=c;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));e.classList.add("on");render()}
function focus(id){let p=P.find(x=>x.id===id);map.flyTo([p.a,p.o],17);let m=markers.find(x=>Math.abs(x.getLatLng().lat-p.a)<.00001);if(m)setTimeout(()=>m.openPopup(),600)}
function details(id){let p=P.find(x=>x.id===id);sheet.innerHTML=`<h2>${p.i} ${p.n}</h2><small>${p.c} · ROLLY-score ${p.s.toFixed(1).replace(".",",")}</small>${p.d.map(x=>`<div class=row>${x}<span>✓</span></div>`).join("")}<button class=wide onclick="routeTo(${id})">➤ Route naar deze locatie</button>`;sheetbg.classList.add("show")}
function routeTo(id){let p=P.find(x=>x.id===id);sheetbg.classList.remove("show");map.fitBounds(L.latLngBounds([my,[p.a,p.o]]).pad(.4));toast("Routegebied getoond · rolstoelrouting volgt in V7")}
function locateMe(){let s=document.getElementById("status");if(!window.isSecureContext){s.className="status bad";s.textContent="HTTPS vereist voor GPS";return}if(!navigator.geolocation){s.className="status bad";s.textContent="GPS niet beschikbaar";return}s.textContent="Live GPS wordt opgevraagd…";navigator.geolocation.getCurrentPosition(p=>{my=[p.coords.latitude,p.coords.longitude];if(me)me.remove();if(acc)acc.remove();let ic=L.divIcon({className:"",html:"<div class=me></div>",iconSize:[20,20],iconAnchor:[10,10]});me=L.marker(my,{icon:ic,zIndexOffset:1000}).addTo(map).bindPopup("<b>Jij bent hier</b>");acc=L.circle(my,{radius:p.coords.accuracy,color:"#168bdc",weight:1,fillOpacity:.08}).addTo(map);map.flyTo(my,16);setTimeout(()=>me.openPopup(),700);s.className="status good";s.textContent="✓ Live GPS actief · ±"+Math.round(p.coords.accuracy)+" m"},e=>{s.className="status bad";s.textContent=e.code===1?"GPS-toestemming geweigerd":"GPS kon niet worden bepaald"},{enableHighAccuracy:true,timeout:15000})}
async function searchMap(){let q=document.getElementById("q").value.trim();let p=P.find(x=>(x.n+" "+x.c).toLowerCase().includes(q.toLowerCase()));if(p){focus(p.id);return}try{let r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q+", Belgium"));let d=await r.json();if(d[0])map.flyTo([+d[0].lat,+d[0].lon],16);else toast("Niet gevonden")}catch(e){toast("Zoeken niet beschikbaar")}}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}init();
</script></body></html>
